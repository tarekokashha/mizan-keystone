name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Everything that needs no Docker. This is the job that proves claim (A),
  # and it runs on both platforms because the driver is written on Windows
  # and deployed on Linux, and the two disagree about clocks in ways this
  # programme has already been bitten by (see PROTOCOL.md section 3).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: test
        run: python -m pytest -q

  # The timing run is reported, never gated. PROTOCOL.md section 6 refuses to
  # adopt a threshold nobody measured, so this job publishes a distribution
  # as an artefact and does not fail on any number in it. If you are tempted
  # to add a pass/fail rule here, note that tests/test_timing.py asserts the
  # module contains none, and argue for it in PROTOCOL.md first.
  timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: measure
        run: python -m keystone.timing
      - uses: actions/upload-artifact@v4
        with:
          name: timing-${{ github.sha }}
          path: results/timing.json

  # URSim needs a Docker daemon. On the machine this repository was written
  # on the daemon never answered, so the integration test skips there with a
  # reason. GitHub's ubuntu runners do have Docker, which makes this the one
  # place the skip might not fire.
  #
  # STATUS: this job passes, and it proves less than that sounds. The runner
  # has a working engine (docker server 28.0.4 observed), so the skip does
  # not fire here and the smoke test runs. But that test only asserts Docker
  # is reachable. It does not start a URSim container and does not open an
  # RTDE connection, so end-to-end timing remains unmeasured. See
  # LIMITATIONS.md before citing this job as evidence of anything.
  ursim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: report docker status
        run: |
          python -c "from keystone.ursim import docker_status; s = docker_status(); print(('available' if s.available else 'unavailable'), s.reason, sep=': ')"
      - name: ursim tests
        run: python -m pytest tests/test_ursim.py -q -rs
      # The real integration: pulls URSim, boots a controller, opens RTDE and
      # measures the controller clock. Opt in via KEYSTONE_URSIM so the
      # multi-gigabyte pull happens in this job and nowhere else. -s so the
      # measured distribution reaches the log, since it is reported and never
      # gated.
      - name: ursim integration
        env:
          KEYSTONE_URSIM: "1"
        run: python -m pytest tests/test_ursim_integration.py -q -rs -s
