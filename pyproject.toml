[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mizan-keystone"
version = "0.1.0"
description = "M-03 KEYSTONE: a real UR5e LeRobot driver with no safety logic, guarded by M-01 SENTINEL's Shield."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "ur_rtde>=1.6.5",
    "lerobot==0.4.4",
    "mizan-sentinel @ git+https://github.com/tarekokashha/mizan-sentinel",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "hypothesis>=6.100",
]

[tool.setuptools.packages.find]
include = ["keystone*"]
